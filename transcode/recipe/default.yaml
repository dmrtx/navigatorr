schema_version: 2
bundle_version: "2026.09.3"
containers:
  mkv:
    subtitle_copy:
      - subrip
      - srt
      - ass
      - ssa
      - hdmv_pgs_subtitle
      - pgs
      - dvd_subtitle
      - vobsub
      - dvb_subtitle
      - dvb_teletext
      - webvtt
      - text
    subtitle_conversions:
      mov_text:
        target_codec: subrip
        reason: matroska_compatibility
profiles:
  hevc-vt:
    container: mkv
    video: {codec: hevc_videotoolbox, quality: 65}
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: &default_resilience
      max_attempts: 3
      transient_retries: 2
      retry_backoff_seconds: [5, 20]
      max_fallbacks: 1
      fallbacks:
        - {when: container_subtitle_incompatible, action: apply_container_conversion}
        - {when: worker_busy, action: retry}
        - {when: ssh_transient, action: retry}
  hevc-vt-balanced:
    container: mkv
    video: {codec: hevc_videotoolbox, quality: 65}
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  hevc-vt-quality:
    container: mkv
    video: {codec: hevc_videotoolbox, quality: 75}
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  hevc-vt-space:
    container: mkv
    video: {codec: hevc_videotoolbox, quality: 55}
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  general-hevc:
    container: mkv
    video: {codec: hevc_videotoolbox, quality: 70}
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc:
    container: mkv
    video: {codec: hevc_videotoolbox, quality: 80}
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-balanced:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 65
      profile: main
      pixel_format: yuv420p
      prioritize_speed: false
      spatial_aq: false
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-balanced-aq:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 65
      profile: main
      pixel_format: yuv420p
      prioritize_speed: false
      spatial_aq: true
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-quality:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 75
      profile: main
      pixel_format: yuv420p
      prioritize_speed: false
      spatial_aq: true
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-space:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 55
      profile: main
      pixel_format: yuv420p
      prioritize_speed: false
      spatial_aq: false
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-main10:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 65
      profile: main10
      pixel_format: p010le
      prioritize_speed: false
      spatial_aq: false
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-main10-aq:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 65
      profile: main10
      pixel_format: p010le
      prioritize_speed: false
      spatial_aq: true
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  # Software (CPU) HEVC for live-action 1080p sources. Uses libx265 rate control:
  # for libx265 `quality` is CRF (LOWER = HIGHER quality), unlike VideoToolbox
  # -q:v. Preset `slow` favors bitrate efficiency for live-action without the
  # pathological encode times of slower/veryslow. 8-bit main/yuv420p is kept for
  # 8-bit H264 sources (no silent 8->10 conversion).
  live-action-hevc:
    container: mkv
    video:
      codec: libx265
      quality: 24
      preset: slow
      profile: main
      pixel_format: yuv420p
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
    optimization:
      enabled: true
      sampling:
        strategy: distributed
        sample_count: 3
        sample_seconds: 20
        positions: [0.2, 0.5, 0.8]
      quality:
        preferred_metric: vmaf
        vmaf:
          target: 92
          minimum: 88
      search:
        max_candidates: 4
        quality_values: [20, 22, 24, 26]
