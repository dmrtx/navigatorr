schema_version: 1
bundle_version: "2026.09.2"
containers:
  mkv:
    subtitle_copy:
      - subrip
      - srt
      - ass
      - ssa
      - hdmv_pgs_subtitle
      - pgs
      - dvd_subtitle
      - vobsub
      - dvb_subtitle
      - dvb_teletext
      - webvtt
      - text
    subtitle_conversions:
      mov_text:
        target_codec: subrip
        reason: matroska_compatibility
profiles:
  general-hevc:
    container: mkv
    video: {codec: hevc_videotoolbox, quality: 70}
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: &default_resilience
      max_attempts: 3
      transient_retries: 2
      retry_backoff_seconds: [5, 20]
      max_fallbacks: 1
      fallbacks:
        - {when: container_subtitle_incompatible, action: apply_container_conversion}
        - {when: worker_busy, action: retry}
        - {when: ssh_transient, action: retry}
  anime-hevc:
    container: mkv
    video: {codec: hevc_videotoolbox, quality: 80}
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-balanced:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 65
      profile: main
      pixel_format: yuv420p
      prioritize_speed: false
      spatial_aq: false
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-balanced-aq:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 65
      profile: main
      pixel_format: yuv420p
      prioritize_speed: false
      spatial_aq: true
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-quality:
    container: mkv
    video:
      codec: hevc_videotoolbox
      quality: 75
      profile: main
      pixel_format: yuv420p
      prioritize_speed: false
      spatial_aq: true
      realtime: false
    audio: {mode: copy}
    subtitles: {mode: preserve, convert_incompatible: true}
    preserve: {metadata: true, chapters: true, attachments: true}
    resilience: *default_resilience
  anime-hevc-space:
