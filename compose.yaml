services:
  navigatorr:
    image: ghcr.io/dmrtx/navigatorr:latest
    pull_policy: always
    network_mode: host
    stdin_open: true
    tty: false
    environment:
      - TZ=UTC
    volumes:
      # Read-only configuration mount
      - /home/navigatorr/.config/navigatorr/config.yaml:/root/.config/navigatorr/config.yaml:ro
      # Persistent SQLite database & spec cache
      - navigatorr-cache:/root/.cache/navigatorr
      # Media libraries & downloads:
      # The target inside container MUST match allowed_read_roots / allowed_write_roots in config.yaml!
      # - /srv/media/Anime:/media/Anime:ro
      # - /srv/media/Movies:/media/Movies:ro
      # - /srv/media/Downloads:/media/Downloads:rw
    # Use "no" for on-demand MCP stdio sessions; use "unless-stopped" for persistent background service
    restart: "no"

volumes:
  navigatorr-cache:
