name: Gitleaks

# Every commit is scanned when it is pushed, so a pull_request run would scan the
# same commits a second time.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan pushed commits or pull request
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan full history, including secrets removed by later commits
        run: >-
          gitleaks git --redact=100 --no-banner --log-opts="--all"
          --ignore-gitleaks-allow
          --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-no-ignore"
