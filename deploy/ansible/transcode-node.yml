---
- name: Setup macOS Apple Silicon Transcode Node for Navigatorr
  hosts: all
  gather_facts: true

  vars:
    transcode_home_dir: "{{ ansible_facts['user_dir'] }}"
    transcode_bin_dir: "{{ transcode_home_dir }}/.local/bin"
    transcode_config_dir: "{{ transcode_home_dir }}/.config/navigatorr-transcode"
    transcode_state_dir: "{{ transcode_home_dir }}/.local/share/navigatorr-transcode/jobs"
    transcode_source_dir: "{{ playbook_dir }}/../.."
    transcode_build_path: "/tmp/navigatorr-transcode.build"
    transcode_brew_path: "/opt/homebrew/bin/brew"
    transcode_go_path: "/opt/homebrew/bin/go"
    transcode_ffmpeg_path: "/opt/homebrew/bin/ffmpeg"
    transcode_ffprobe_path: "/opt/homebrew/bin/ffprobe"
    transcode_remote_binary: "/opt/homebrew/bin/navigatorr-transcode"
    transcode_allowed_roots:
      - "/Volumes/media"
    transcode_max_parallel_jobs: 1
    transcode_quality: 65
    transcode_worker_smoke_job_id: "ansible-worker-smoke"
    transcode_worker_smoke_dir: "/Volumes/media/.navigatorr-smoke"
    transcode_worker_smoke_source: "/Volumes/media/.navigatorr-smoke/input.mkv"
    transcode_worker_smoke_candidate: "/Volumes/media/.navigatorr-smoke/candidate.mkv"

  pre_tasks:
    - name: Verify target is running macOS (Darwin)
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "Darwin"
        fail_msg: "Target host must be macOS (Darwin), but detected {{ ansible_facts['os_family'] }}."

    - name: Verify target architecture is Apple Silicon (arm64)
      ansible.builtin.assert:
        that:
          - ansible_facts["architecture"] == "arm64"
        fail_msg: "Target host must be Apple Silicon arm64, but detected {{ ansible_facts['architecture'] }}."

  tasks:
    - name: Check whether Homebrew is installed
      ansible.builtin.stat:
        path: "{{ transcode_brew_path }}"
      register: homebrew_stat

    - name: Install Homebrew when missing
      ansible.builtin.shell: |
        set -euo pipefail
        /bin/bash -c "$(/usr/bin/curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        executable: /bin/bash
        creates: "{{ transcode_brew_path }}"
      environment:
        NONINTERACTIVE: "1"
      when: not homebrew_stat.stat.exists

    - name: Verify Homebrew is available
      ansible.builtin.stat:
        path: "{{ transcode_brew_path }}"
      register: homebrew_ready

    - name: Require Homebrew after bootstrap
      ansible.builtin.assert:
        that:
          - homebrew_ready.stat.exists
        fail_msg: "Homebrew bootstrap failed; expected {{ transcode_brew_path }} to exist."

    - name: Check required Homebrew formulae
      ansible.builtin.command:
        cmd: "{{ transcode_brew_path }} list --formula {{ item }}"
      loop:
        - go
        - ffmpeg
      register: brew_formula_checks
      changed_when: false
      failed_when: false

    - name: Install missing Homebrew formulae
      ansible.builtin.command:
        cmd: "{{ transcode_brew_path }} install {{ item.item }}"
      loop: "{{ brew_formula_checks.results }}"
      when: item.rc != 0

    - name: Create transcode worker directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ transcode_bin_dir }}"
        - "{{ transcode_config_dir }}"
        - "{{ transcode_state_dir }}"

    - name: Build navigatorr-transcode from the checked-out Navigatorr source
      ansible.builtin.command:
        cmd: "{{ transcode_go_path }} build -trimpath -o {{ transcode_build_path }} ./cmd/navigatorr-transcode"
        chdir: "{{ transcode_source_dir }}"
      changed_when: false

    - name: Deploy navigatorr-transcode binary
      ansible.builtin.copy:
        src: "{{ transcode_build_path }}"
        dest: "{{ transcode_bin_dir }}/navigatorr-transcode"
        remote_src: true
        mode: "0755"

    - name: Symlink navigatorr-transcode into Homebrew bin
      ansible.builtin.file:
        src: "{{ transcode_bin_dir }}/navigatorr-transcode"
        dest: "{{ transcode_remote_binary }}"
        state: link

    - name: Remove temporary transcode build artifact
      ansible.builtin.file:
        path: "{{ transcode_build_path }}"
        state: absent
      changed_when: false

    - name: Install worker configuration file
      ansible.builtin.template:
        src: templates/navigatorr-transcode-config.yaml.j2
        dest: "{{ transcode_config_dir }}/config.yaml"
        mode: "0644"

    - name: Verify /Volumes/media storage directory exists
      ansible.builtin.stat:
        path: "/Volumes/media"
      register: media_storage_stat

    - name: Warn if /Volumes/media is not currently accessible
      ansible.builtin.debug:
        msg: "WARNING: /Volumes/media does not exist on this node. Mount shared storage before submitting transcoding jobs."
      when: not media_storage_stat.stat.exists

    - name: Run navigatorr-transcode doctor check
      ansible.builtin.command:
        cmd: "{{ transcode_remote_binary }} doctor"
      register: doctor_check
      changed_when: false
      failed_when: doctor_check.rc != 0

    - name: Generate synthetic 2-second test video for smoke validation
      ansible.builtin.command:
        cmd: >
          {{ transcode_ffmpeg_path }} -y
          -f lavfi -i testsrc=duration=2:size=320x240:rate=24
          -f lavfi -i sine=duration=2:frequency=1000
          -c:v libx264 -c:a aac
          /tmp/navigatorr_smoke_input.mkv
      changed_when: false

    - name: Transcode smoke test video using hevc_videotoolbox
      ansible.builtin.command:
        cmd: >
          {{ transcode_ffmpeg_path }} -y
          -i /tmp/navigatorr_smoke_input.mkv
          -map 0:v? -map 0:a? -map 0:s? -map 0:t?
          -map_metadata 0 -map_chapters 0
          -c copy -c:v hevc_videotoolbox -q:v {{ transcode_quality }}
          /tmp/navigatorr_smoke_output.mkv
      changed_when: false

    - name: Verify smoke candidate output codec is HEVC
      ansible.builtin.command:
        cmd: >
          {{ transcode_ffprobe_path }} -v error
          -select_streams v:0
          -show_entries stream=codec_name
          -of default=noprint_wrappers=1:nokey=1
          /tmp/navigatorr_smoke_output.mkv
      register: smoke_probe
      changed_when: false
      failed_when: smoke_probe.stdout | trim != "hevc"

    - name: Clean up synthetic smoke test artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/navigatorr_smoke_input.mkv
        - /tmp/navigatorr_smoke_output.mkv
      changed_when: false

    - name: Exercise navigatorr-transcode submit/status lifecycle
      when: media_storage_stat.stat.exists
      block:
        - name: Reset prior Ansible worker smoke artifacts
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ transcode_worker_smoke_dir }}"
            - "{{ transcode_state_dir }}/{{ transcode_worker_smoke_job_id }}"
          changed_when: false

        - name: Create worker smoke directory inside allowed media root
          ansible.builtin.file:
            path: "{{ transcode_worker_smoke_dir }}"
            state: directory
            mode: "0755"
          changed_when: false

        - name: Generate worker lifecycle synthetic source
          ansible.builtin.command:
            cmd: >
              {{ transcode_ffmpeg_path }} -y
              -f lavfi -i testsrc=duration=2:size=320x240:rate=24
              -f lavfi -i sine=duration=2:frequency=1000
              -c:v libx264 -c:a aac
              {{ transcode_worker_smoke_source }}
          changed_when: false

        - name: Capture worker smoke source SHA-256 before submit
          ansible.builtin.stat:
            path: "{{ transcode_worker_smoke_source }}"
            checksum_algorithm: sha256
          register: worker_smoke_source_before

        - name: Submit synthetic job through navigatorr-transcode CLI
          ansible.builtin.command:
            cmd: "{{ transcode_remote_binary }} submit"
            stdin: >-
              {{ {
                'id': transcode_worker_smoke_job_id,
                'source_path': transcode_worker_smoke_source,
                'candidate_path': transcode_worker_smoke_candidate,
                'profile': 'hevc-vt'
              } | to_json }}
          register: worker_smoke_submit
          changed_when: false
          failed_when: worker_smoke_submit.rc != 0

        - name: Wait for synthetic worker job to complete
          ansible.builtin.command:
            cmd: "{{ transcode_remote_binary }} status {{ transcode_worker_smoke_job_id }}"
          register: worker_smoke_status
          changed_when: false
          retries: 30
          delay: 1
          until: (worker_smoke_status.stdout | from_json).status == "completed"
          failed_when: >-
            worker_smoke_status.rc != 0 or
            ((worker_smoke_status.stdout | from_json).status in ["failed", "cancelled"])

        - name: Verify worker candidate output codec is HEVC
          ansible.builtin.command:
            cmd: >
              {{ transcode_ffprobe_path }} -v error
              -select_streams v:0
              -show_entries stream=codec_name
              -of default=noprint_wrappers=1:nokey=1
              {{ transcode_worker_smoke_candidate }}
          register: worker_smoke_probe
          changed_when: false
          failed_when: worker_smoke_probe.stdout | trim != "hevc"

        - name: Capture worker smoke source SHA-256 after completion
          ansible.builtin.stat:
            path: "{{ transcode_worker_smoke_source }}"
            checksum_algorithm: sha256
          register: worker_smoke_source_after

        - name: Require synthetic source to remain byte-identical
          ansible.builtin.assert:
            that:
              - worker_smoke_source_before.stat.checksum == worker_smoke_source_after.stat.checksum
            fail_msg: "navigatorr-transcode modified the synthetic source file; refusing deployment."

      always:
        - name: Clean up worker lifecycle smoke artifacts
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ transcode_worker_smoke_dir }}"
            - "{{ transcode_state_dir }}/{{ transcode_worker_smoke_job_id }}"
          changed_when: false
